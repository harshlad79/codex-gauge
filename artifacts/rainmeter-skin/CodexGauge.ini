; CodexGauge 0.2 - graphs are calculated by GraphModel / GraphView (Lua 5.1).
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
; MeasurePoll also runs on its first update; do not launch the collector twice.
OnRefreshAction=[!CommandMeasure MeasureApplyUsage "Apply()"]
MouseOverAction=[!CommandMeasure MeasureApplyUsage "OpenDetails()"]
MouseLeaveAction=[!CommandMeasure MeasureApplyUsage "CloseDetails()"]

[Metadata]
Name=CodexGauge
Version=0.2
Information=Session interval usage and Weekly persistent cumulative stacks.
License=MIT

[Variables]
Text=234,239,245
Muted=158,172,189

[MeasureApplyUsage]
Measure=Script
ScriptFile=#@#Scripts\ApplyUsage.lua

[MeasureFetch]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File "#@#Scripts\FetchUsage.ps1" -OutFile "#@#Usage.inc"
State=Hide
OutputType=UTF8
FinishAction=[!CommandMeasure MeasureApplyUsage "Apply()"]

[MeasurePoll]
Measure=Calc
Formula=1
UpdateDivider=60
OnUpdateAction=[!CommandMeasure MeasureFetch "Run"]

[TextStyle]
FontFace=Segoe UI
FontSize=9
FontColor=#Text#
AntiAlias=1
DynamicVariables=1
ClipString=1
W=288
H=20

[DetailStyle]
